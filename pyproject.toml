[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convocalivre"
version = "0.2.0"
description = "Evidence-first, offline matching of names in Brazilian public gazette text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=5.0,<7"]
license = "MIT"
authors = [{name = "ConvocaLivre contributors"}]
keywords = ["civic-tech", "brasil", "diario-oficial", "open-data", "transparencia"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: General",
]

[project.scripts]
convocalivre = "convocalivre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
