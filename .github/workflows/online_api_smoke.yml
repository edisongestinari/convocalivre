name: API online smoke test (non-personal)

on:
  pull_request:
    paths:
      - 'src/convocalivre/online_search.py'
      - '.github/workflows/online_api_smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check official provider hosts with non-personal keyword
        shell: bash
        run: |
          python - <<'PY'
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          params = urlencode({
              "territory_ids": "2700706",
              "querystring": "orcamento",
              "size": "1",
              "number_of_excerpts": "1",
              "excerpt_size": "120",
          })
          endpoints = [
              "https://api.queridodiario.ok.org.br/gazettes",
              "https://queridodiario.ok.org.br/api/gazettes",
              "https://api.queridodiario.org.br/gazettes",
              "https://queridodiario.org.br/api/gazettes",
          ]
          for endpoint in endpoints:
              try:
                  req = Request(endpoint+"?"+params,
                                headers={"User-Agent":"ConvocaLivre-Smoke/0.5"})
                  with urlopen(req, timeout=6) as r:
                      first = r.read(20)
                      print("Endpoint:", endpoint, "status:", r.status,
                            "is_json:", first.lstrip().startswith(b"{"))
              except Exception as exc:
                  print("Endpoint:", endpoint,
                        "unavailable:", type(exc).__name__,
                        "http_status:", getattr(exc,"code",None),
                        "reason:", type(getattr(exc,"reason",None)).__name__)
          PY
