name: Public PDF audit (exploratory)

on:
  pull_request:
    paths:
      - 'src/convocalivre/external_pdf_audit.py'
      - 'tests/fixtures/public_pdf_cases.json'
      - '.github/workflows/public_pdf_audit.yml'

permissions:
  contents: read

jobs:
  public-pdf-audit:
    name: Auditar PDFs públicos (sem nomes em claro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install local package
        run: python -m pip install -e .
      - name: Evaluate independent published PDFs
        run: |
          python -m convocalivre.external_pdf_audit tests/fixtures/public_pdf_cases.json --output public_pdf_audit_result.json
          python - <<'PY'
          import json
          x=json.load(open('public_pdf_audit_result.json',encoding='utf-8'))
          print("Sources available:",x['available_sources'],"/",len(x['source_statuses']))
          print("Positive reference cases evaluated:",x['positive_cases_evaluated'],"/",x['positive_reference_cases'])
          print("Name presence:", x['name_presence'])
          print("Act exact matches:",x['act_classification']['exact_matches'],"/",x['act_classification']['n'])
          print("Unavailable sources:", [s['source_id'] for s in x['source_statuses'] if s['status']!='available'])
          print("Unresolved targets:", x['unresolved_positive_cases'])
          print("Cases with wrong act:", [
              c['id'] for c in x['case_results']
              if c['status']=='evaluated' and c['expected']!='no_name_match'
              and c.get('predicted')!=c['expected']
          ])
          PY
      - name: Retain aggregate audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-pdf-audit-summary
          path: public_pdf_audit_result.json
          retention-days: 30
